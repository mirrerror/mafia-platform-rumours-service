name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version from git tag
      id: version
      run: |
        # Get the latest tag, or default to 0.1.0 if no tags exist
        VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./MafiaRumoursService
        file: ./MafiaRumoursService/MafiaRumoursService/Dockerfile
        push: true
        tags: |
          m1rrerror/mafia-rumours-service:${{ steps.version.outputs.version }}
          m1rrerror/mafia-rumours-service:latest
        cache-from: type=registry,ref=m1rrerror/mafia-rumours-service:latest
        cache-to: type=inline
